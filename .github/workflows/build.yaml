---
name: Build and push

on:
  workflow_dispatch:
  pull_request:
  push: {branches: [master]}

defaults:
  run:
    shell: bash -euo pipefail {0}

permissions:
  contents: read

# Concurrency is declared per job rather than for the workflow

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-lint-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: yamllint
        if: ${{ !cancelled() }}
        run: |
          pip install --disable-pip-version-check --quiet yamllint
          yamllint --version
          yamllint --strict -c .yamllint.yaml .

      - name: actionlint
        if: ${{ !cancelled() }}
        uses: docker://rhysd/actionlint@sha256:a0383f60d92601e2694e24b24d37df7b6a40bed7cedbc447611c50009bf02d94  # 1.7.9
        with:
          args: -color

      - name: shellcheck
        if: ${{ !cancelled() }}
        run: |
          shellcheck --version
          shellcheck .bin/*.sh

      # Every symlink in the tree is relative and must still resolve once the
      # directories are copied side by side under /mnt/karlsenfr in the image,
      # e.g. other/.well-known -> ../www/.well-known/. A link that escapes the
      # repo root would silently ship as a dangling entry in a scratch image.
      - name: Check symlinks resolve inside the repo
        if: ${{ !cancelled() }}
        run: |
          status=0
          while IFS= read -r link; do
            target=$(readlink -m "$link")
            if [ ! -e "$target" ]; then
              echo "::error file=${link}::Dangling symlink -> $(readlink "$link")"; status=1
            elif [ "${target#"${PWD}/"}" = "$target" ]; then
              echo "::error file=${link}::Symlink escapes the repo -> $(readlink "$link")"; status=1
            fi
          done < <(git ls-files -s | sed -n 's/^120000 [0-9a-f]* [0-9]\t//p')
          exit "$status"

      # RFC 9116 requires Expires to be in the future, so an expired file fails
      # the build rather than shipping. www/.well-known/security.txt is
      # clearsigned with an offline key and CI cannot regenerate it.
      - name: Check security.txt expiry
        if: ${{ !cancelled() }}
        run: |
          file=www/.well-known/security.txt

          expires=$(sed -n 's/^Expires: //p' "$file" | head -n1)
          if [ -z "$expires" ]; then
            echo "::error file=${file}::No Expires field found (required by RFC 9116)"
            exit 1
          fi

          if ! epoch=$(date -u -d "$expires" +%s 2>/dev/null); then
            echo "::error file=${file}::Unparseable Expires value: ${expires}"
            exit 1
          fi

          left=$(( (epoch - $(date -u +%s)) / 86400 ))
          echo "security.txt expires ${expires} (${left} days)"

          if [ "$left" -lt 0 ]; then
            echo "::error file=${file}::Expired ${left#-} days ago; re-run .bin/gen_securitytxt.sh"
            exit 1
          elif [ "$left" -lt 30 ]; then
            echo "::warning file=${file}::Expires in ${left} days; re-run .bin/gen_securitytxt.sh"
          fi

  docker:
    name: Build and push Docker image
    needs: [lint]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-docker-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write   # cosign keyless signing (OIDC)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Buildx  # Use the docker-container driver to enable provenance and SBOM attestation features
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One immutable tag per commit. Deploys pin a digest or an exact tag.
      - name: Compute image ref
        id: img
        run: |
          name="${GITHUB_REPOSITORY##*/}"
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${name//./-}"
          repo="${repo,,}"
          {
            echo "repo=${repo}"
            echo "ref=${repo}:${GITHUB_SHA::7}"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      # Tags are immutable in the registry, so a re-run over a commit that was
      # already published cannot overwrite its tag.
      - name: Check the tag is free
        env:
          REF: ${{ steps.img.outputs.ref }}
        run: |
          if docker buildx imagetools inspect "$REF" >/dev/null 2>&1; then
            echo "::error::${REF} already exists and tags are immutable; push a new commit to publish again"
            exit 1
          fi
          echo "${REF} is free"

      - name: Build and push image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.img.outputs.ref }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.img.outputs.created }}
            org.opencontainers.image.licenses=NOASSERTION
          provenance: mode=max   # full SLSA build provenance attestation
          sbom: true             # generate + attach an SBOM attestation

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      # Keyless signing via the job's GitHub OIDC identity; signs the digest,
      # which is what a signature must bind to regardless of tag immutability.
      - name: Sign image
        env:
          REPO: ${{ steps.img.outputs.repo }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${REPO}@${DIGEST}"

      - name: Summary
        env:
          REF: ${{ steps.img.outputs.ref }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo '### Image pushed'
            echo
            echo "- \`${REF}\`"
            echo "- Digest: \`${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
